name: Deploy GitHub Pages

# Publishes ONLY the built game (www/), not the repository: no training
# data, docs, headless tools or the Android project. The hosted build adds a
# strict CSP, a robots.txt, and, when the GATE_PASSPHRASE repository secret
# is set, a passphrase gate in front of the game.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the hosted bundle
        env:
          WEB_HOSTED: "1"
          WEB_GATE: ${{ secrets.GATE_PASSPHRASE }}
        run: node scripts/build-www.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
