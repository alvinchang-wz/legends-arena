<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft A — map blockout</title>
<style>
  html, body { margin: 0; background: #1b1b1b; color: #ddd; font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  canvas { max-width: 100%; height: auto; background: #1e1e1e; }
  .note { font-size: 13px; color: #aaa; max-width: 900px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1520" height="1567"></canvas>
  <div class="note">Base layer: the user's drawing (draft-a-original.png), untouched. Everything in OVERLAY is drawn on top and is up for discussion.</div>
</div>
<script>
/* ============================================================
   Draft A — the user's own layout.

   The drawing itself is the base layer, pixel for pixel. Proposed
   changes are listed in OVERLAY and drawn over it in a distinct colour
   (amber = proposal, red = "remove this"), so nothing the user drew is
   ever reinterpreted. Coordinates are the drawing's pixels (1520 x 1567).
   A = bottom-left, B = top-right; TOP runs up the left edge and along
   the top, BOTTOM along the bottom and up the right edge, MID diagonal.
   ============================================================ */
const OVERLAY = {
  // { x, y, r, label } — proposed epic objective pits
  objectives: [],
  // { x, y, len, thick, deg } — proposed extra walls
  walls: [],
  // { x, y } — proposed bushes
  bushes: [],
  // { x, y, r } — things proposed for removal (drawn as a red cross-out)
  remove: [],
  // { x, y, text } — short notes
  notes: [],
};

const img = new Image();
img.src = 'draft-a-original.png';
img.onload = draw;
const c = document.getElementById('c'), g = c.getContext('2d');
const TAU = Math.PI * 2;

function draw() {
  g.clearRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const AMBER = '#ffb347', RED = '#ff5a5a';
  for (const o of OVERLAY.objectives) {
    g.fillStyle = 'rgba(255,179,71,0.18)'; g.beginPath(); g.arc(o.x, o.y, o.r, 0, TAU); g.fill();
    g.strokeStyle = AMBER; g.lineWidth = 4; g.setLineDash([12, 8]); g.stroke(); g.setLineDash([]);
    if (o.label) { g.fillStyle = AMBER; g.font = 'bold 20px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.label, o.x, o.y); }
  }
  g.fillStyle = 'rgba(255,179,71,0.85)';
  for (const w of OVERLAY.walls) {
    g.save(); g.translate(w.x, w.y); g.rotate(w.deg * Math.PI / 180);
    g.beginPath(); g.roundRect(-w.len / 2, -w.thick / 2, w.len, w.thick, 8); g.fill(); g.restore();
  }
  for (const b of OVERLAY.bushes) {
    g.save(); g.translate(b.x, b.y); g.rotate(0.5);
    g.fillStyle = 'rgba(255,179,71,0.35)'; g.beginPath(); g.ellipse(0, 0, 18, 11, 0, 0, TAU); g.fill();
    g.strokeStyle = AMBER; g.lineWidth = 1.5;
    for (let i = -14; i <= 14; i += 5) { g.beginPath(); g.moveTo(i, -10); g.lineTo(i + 6, 10); g.stroke(); }
    g.restore();
  }
  for (const r of OVERLAY.remove) {
    g.strokeStyle = RED; g.lineWidth = 4;
    g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(r.x - r.r * 0.7, r.y - r.r * 0.7); g.lineTo(r.x + r.r * 0.7, r.y + r.r * 0.7); g.stroke();
  }
  for (const n of OVERLAY.notes) {
    g.font = 'bold 18px system-ui'; g.textAlign = 'left'; g.textBaseline = 'middle';
    const w = g.measureText(n.text).width + 16;
    g.fillStyle = 'rgba(20,20,20,0.85)'; g.fillRect(n.x - 8, n.y - 14, w, 28);
    g.strokeStyle = AMBER; g.lineWidth = 1.5; g.strokeRect(n.x - 8, n.y - 14, w, 28);
    g.fillStyle = AMBER; g.fillText(n.text, n.x, n.y);
  }
}
</script>
</body>
</html>
